name: Controls Dev Build

on:
  push:
    branches:
      - controls-settings
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
        df -h /

    - uses: actions/checkout@v4
    - name: set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Inject credentials
      run: |
        cat <<EOF > local.properties
        POSTHOG_API_KEY=unset
        POSTHOG_HOST=https://us.i.posthog.com
        STEAMGRIDDB_API_KEY=unset
        CLOUD_PROJECT_NUMBER=0
        EOF

    - name: Install Android SDK Build Tools
      run: |
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        fi
        yes | "$SDKMANAGER" --install "build-tools;34.0.0"

    # Keep one debug key across runs so each test build can update the previous one in place.
    - name: Restore debug keystore
      uses: actions/cache@v4
      with:
        path: ~/.android/debug.keystore
        key: controlsdev-debug-keystore

    - name: Build with Gradle
      run: ./gradlew :app:bundleLegacyControlsdev

    - name: Stop Gradle daemons
      run: ./gradlew --stop

    - name: Extract universal APK
      run: |
        java -Xmx3g -jar tools/bundletool-all-1.17.2.jar build-apks \
          --bundle=app/build/outputs/bundle/legacyControlsdev/app-legacy-controlsdev.aab \
          --output=controlsdev.apks --mode=universal \
          --ks="$HOME/.android/debug.keystore" --ks-pass=pass:android --ks-key-alias=androiddebugkey --key-pass=pass:android
        unzip -p controlsdev.apks universal.apk > gamenative-controlsdev.apk
        ls -lah gamenative-controlsdev.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gamenative-controlsdev
        path: gamenative-controlsdev.apk
        retention-days: 14

    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: controlsdev-${{ github.run_number }}
        prerelease: true
        files: gamenative-controlsdev.apk
