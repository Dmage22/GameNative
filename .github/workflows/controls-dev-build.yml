name: Controls Dev Build

on:
  push:
    branches:
      - controls-settings
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
        df -h /

    - uses: actions/checkout@v4
    - name: set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Inject credentials
      run: |
        cat <<EOF > local.properties
        POSTHOG_API_KEY=
        POSTHOG_HOST=
        STEAMGRIDDB_API_KEY=
        CLOUD_PROJECT_NUMBER=
        EOF

    - name: Install Android SDK Build Tools
      run: |
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        fi
        yes | "$SDKMANAGER" --install "build-tools;34.0.0"

    - name: Build with Gradle
      run: ./gradlew assembleControlsdev

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gamenative-controlsdev
        path: app/build/outputs/apk/controlsdev/**/*.apk
        retention-days: 14

    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: controlsdev-${{ github.run_number }}
        prerelease: true
        files: app/build/outputs/apk/controlsdev/**/*.apk